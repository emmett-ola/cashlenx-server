coverage:
  precision: 2
  round: down
  range: "50...80"

  status:
    project:
      default:
        target: auto
        threshold: 5%
        if_ci_failed: error
    patch:
      default:
        target: 60%
        threshold: 10%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

flags:
  github-actions:
    paths:
      - .
  travis:
    paths:
      - .
  circleci:
    paths:
      - .

ignore:
  - "docs/**"
  - "scripts/**"
  - "migrations/**"
  - "docker/**"
