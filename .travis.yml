language: go

go:
  - "1.23.x"

os: linux
dist: jammy

branches:
  only:
    - main
    - develop
    - /^dev\/.*$/

cache:
  directories:
    - "$GOMODCACHE"
    - "$GOCACHE"

before_install:
  - go version

install:
  - go mod download

script:
  - scripts/ci-test.sh
  - go build -v ./...

after_success:
  - bash <(curl -s https://codecov.io/bash) -f coverage.out -F travis || echo "Codecov upload skipped or failed"
