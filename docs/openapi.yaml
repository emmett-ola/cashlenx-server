openapi: 3.0.3
info:
  title: CashLenX API
  description: Personal finance management API
  version: 0.6.0
  contact:
    name: CashLenX Team
    email: support@cashlenx.com

servers:
  - url: http://localhost:8080/api/v0
    description: Local development server

tags:
  - name: System
  - name: Authentication
  - name: User
  - name: Admin
  - name: Cash Flow
  - name: Category
  - name: Statistic

paths:
  /open/health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [System]
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /open/version:
    get:
      summary: Version information
      operationId: versionInfo
      tags: [System]
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /open/auth/login:
    post:
      summary: User login or token refresh
      description: Provide username/password for login, or refresh_token for token refresh.
      operationId: login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
        '401':
          $ref: '#/components/responses/WrappedResponse'

  /open/auth/register:
    post:
      summary: User registration
      description: Completes public self-registration after email verification. Clients must first call `/open/verification/code` with `purpose=signup`, then `/open/verification/verify`, and submit the returned `verification_token` here. This endpoint creates a normal active user account and returns the created user record; it does not issue login tokens.
      operationId: register
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
        '403':
          $ref: '#/components/responses/WrappedResponse'
        '409':
          $ref: '#/components/responses/WrappedResponse'

  /open/verification/code:
    post:
      summary: Send verification code
      description: Sends a purpose-scoped verification code to the supplied email address. For self-registration, use `purpose=signup`. The signup flow rejects email addresses that already belong to an account.
      operationId: sendVerificationCode
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendVerificationCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
        '409':
          $ref: '#/components/responses/WrappedResponse'
        '429':
          $ref: '#/components/responses/WrappedResponse'
        '500':
          $ref: '#/components/responses/WrappedResponse'

  /open/verification/verify:
    post:
      summary: Verify code and return one-time token
      description: Verifies a previously emailed code and returns a one-time `token` plus `expires_at`. For signup, that returned token must be passed to `/open/auth/register` as `verification_token`.
      operationId: verifyVerificationCode
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyVerificationCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /open/auth/logout:
    post:
      summary: User logout
      description: Public idempotent logout endpoint. Without a token it returns OK as a no-op. Provide refresh_token to revoke one session, or provide a bearer access token without refresh_token to revoke all sessions for that user.
      operationId: logout
      tags: [Authentication]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /auth/tokens:
    get:
      summary: List current user's refresh tokens
      operationId: getTokens
      tags: [Authentication]
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '401':
          $ref: '#/components/responses/WrappedResponse'

  /open/auth/reset-password:
    post:
      summary: Request password reset
      operationId: requestPasswordReset
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /open/auth/reset-password/confirm:
    post:
      summary: Confirm password reset
      operationId: confirmPasswordReset
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /user/profile:
    get:
      summary: Get current user profile
      operationId: getUserProfile
      tags: [User]
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '401':
          $ref: '#/components/responses/WrappedResponse'
    put:
      summary: Update current user profile
      operationId: updateUserProfile
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /user/configuration:
    get:
      summary: Get current user configuration profile
      operationId: getUserConfiguration
      tags: [User]
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '401':
          $ref: '#/components/responses/WrappedResponse'
    post:
      summary: Create or update current user configuration profile
      operationId: createUserConfiguration
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserConfigurationRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
    put:
      summary: Update current user configuration profile
      operationId: updateUserConfiguration
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserConfigurationRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /user/password:
    put:
      summary: Change current user password
      operationId: changeUserPassword
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /user/email/change:
    post:
      summary: Request email change
      operationId: requestEmailChange
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChangeEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /user/email/confirm:
    post:
      summary: Confirm email change
      operationId: confirmEmailChange
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserConfirmEmailChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /user/account:
    delete:
      summary: Delete current user account
      operationId: deleteUserAccount
      tags: [User]
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '401':
          $ref: '#/components/responses/WrappedResponse'

  /user/database/backup:
    get:
      summary: Export current user's data
      operationId: exportUserData
      tags: [User]
      responses:
        '200':
          description: User data export file
          content:
            application/json:
              schema:
                type: string
                format: binary

  /user/database/restore:
    post:
      summary: Import current user's data
      operationId: importUserData
      tags: [User]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /admin/user:
    post:
      summary: Create user
      operationId: createUser
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
    get:
      summary: List users
      operationId: listAllUsers
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /admin/user/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
    put:
      summary: Update user by ID
      operationId: updateUserById
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
    delete:
      summary: Delete user by ID
      operationId: deleteUserById
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /admin/database/backup:
    get:
      summary: Download full database dump
      operationId: dumpDatabase
      tags: [Admin]
      responses:
        '200':
          description: Database dump file
          content:
            application/json:
              schema:
                type: string
                format: binary

  /admin/database/restore:
    post:
      summary: Restore full database dump
      operationId: restoreDatabase
      tags: [Admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/expense:
    post:
      summary: Create expense cash flow
      operationId: createExpense
      tags: [Cash Flow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashFlowRequest'
      responses:
        '201':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /cash/income:
    post:
      summary: Create income cash flow
      operationId: createIncome
      tags: [Cash Flow]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashFlowRequest'
      responses:
        '201':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /cash:
    get:
      summary: List cash flows
      operationId: listAllTransactions
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: type
          in: query
          description: Filter by cash flow type
          schema:
            type: string
            enum: [income, expense]
        - name: category_id
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: description
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/range:
    get:
      summary: List cash flows by date range
      operationId: getTransactionsByDateRange
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/date/{date}:
    get:
      summary: List cash flows by date
      operationId: getTransactionsByDate
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
    delete:
      summary: Delete cash flows by date
      operationId: deleteTransactionsByDate
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/summary/daily/{date}:
    get:
      summary: Get daily cash summary
      operationId: getDailySummary
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/summary/total:
    get:
      summary: Get total cash summary
      operationId: getTotalSummary
      tags: [Cash Flow]
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/summary/monthly/{month}:
    get:
      summary: Get monthly cash summary
      operationId: getMonthlySummary
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/summary/yearly/{year}:
    get:
      summary: Get yearly cash summary
      operationId: getYearlySummary
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /cash/{id}:
    get:
      summary: Get cash flow by ID
      operationId: getTransactionById
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
    put:
      summary: Update cash flow by ID
      operationId: updateTransactionById
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashFlowRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
    delete:
      summary: Delete cash flow by ID
      operationId: deleteTransactionById
      tags: [Cash Flow]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /category:
    post:
      summary: Create category
      operationId: createCategory
      tags: [Category]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
    get:
      summary: List categories
      operationId: listAllCategories
      tags: [Category]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: parent_id
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /category/name/{name}:
    get:
      summary: Get category by name
      operationId: getCategoryByName
      tags: [Category]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /category/{parent_id}/children:
    get:
      summary: Get child categories
      operationId: getChildCategories
      tags: [Category]
      parameters:
        - name: parent_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /category/tree:
    get:
      summary: Get category tree
      operationId: getCategoryTree
      tags: [Category]
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [income, expense]
        - name: max_depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /category/{id}:
    get:
      summary: Get category by ID
      operationId: getCategoryById
      tags: [Category]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
    put:
      summary: Update category by ID
      operationId: updateCategoryById
      tags: [Category]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'
    delete:
      summary: Delete category by ID
      operationId: deleteCategoryById
      tags: [Category]
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/export:
    get:
      summary: Export current user's statistics/cash-flow data
      operationId: exportStatisticData
      tags: [Statistic]
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
            pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
        - name: to_date
          in: query
          schema:
            type: string
            pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, csv, pdf]
            default: xlsx
      responses:
        '200':
          description: Export file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary

  /statistic/import:
    post:
      summary: Import current user's statistics/cash-flow data
      operationId: importStatisticData
      tags: [Statistic]
      parameters:
        - name: file_path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'
        '400':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/summary/daily/{date}:
    get:
      summary: Get daily statistic summary
      operationId: getStatisticDailySummary
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/summary/monthly/{month}:
    get:
      summary: Get monthly statistic summary
      operationId: getStatisticMonthlySummary
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/summary/yearly/{year}:
    get:
      summary: Get yearly statistic summary
      operationId: getStatisticYearlySummary
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/breakdown/daily/{date}:
    get:
      summary: Get daily statistic breakdown
      operationId: getStatisticDailyBreakdown
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/breakdown/monthly/{month}:
    get:
      summary: Get monthly statistic breakdown
      operationId: getStatisticMonthlyBreakdown
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/breakdown/yearly/{year}:
    get:
      summary: Get yearly statistic breakdown
      operationId: getStatisticYearlyBreakdown
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/trends/daily/{date}:
    get:
      summary: Get daily statistic trends
      operationId: getStatisticDailyTrends
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/trends/monthly/{month}:
    get:
      summary: Get monthly statistic trends
      operationId: getStatisticMonthlyTrends
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/trends/yearly/{year}:
    get:
      summary: Get yearly statistic trends
      operationId: getStatisticYearlyTrends
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/top/daily/{date}:
    get:
      summary: Get daily top expenses
      operationId: getStatisticDailyTop
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/TopLimit'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/top/monthly/{month}:
    get:
      summary: Get monthly top expenses
      operationId: getStatisticMonthlyTop
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/TopLimit'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/top/yearly/{year}:
    get:
      summary: Get yearly top expenses
      operationId: getStatisticYearlyTop
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/TopLimit'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/dashboard/{period}/{date}:
    get:
      summary: Get dashboard overview
      operationId: getStatisticDashboard
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/FlexibleDate'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/chart/income-expense/{period}/{date}:
    get:
      summary: Get income/expense chart data
      operationId: getIncomeExpenseChart
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/FlexibleDate'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/chart/category-distribution/{period}/{date}:
    get:
      summary: Get category distribution chart data
      operationId: getCategoryDistributionChart
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/FlexibleDate'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [income, expense]
            default: expense
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/chart/monthly-comparison/{year}:
    get:
      summary: Get monthly comparison chart data
      operationId: getMonthlyComparisonChart
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

  /statistic/chart/spending-heatmap/{year}:
    get:
      summary: Get spending heatmap chart data
      operationId: getSpendingHeatmapChart
      tags: [Statistic]
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          $ref: '#/components/responses/WrappedResponse'

components:
  responses:
    WrappedResponse:
      description: Wrapped JSON response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseWrapper'

  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d{8}$'
    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        pattern: '^\d{8}$'
    Date:
      name: date
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{8}$'
    Month:
      name: month
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{6}$'
    Year:
      name: year
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{4}$'
    Period:
      name: period
      in: path
      required: true
      schema:
        type: string
        enum: [daily, monthly, yearly]
    FlexibleDate:
      name: date
      in: path
      required: true
      description: "Date token matched to period: YYYYMMDD for daily, YYYYMM for monthly, YYYY for yearly."
      schema:
        type: string
        pattern: '^\d{4}(\d{2})?(\d{2})?$'
    TopLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10

  schemas:
    ResponseWrapper:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
          oneOf:
            - type: object
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        meta:
          $ref: '#/components/schemas/MetaInfo'
        extra:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required: [code, message, data, meta, extra, errors]

    ErrorItem:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required: [message]

    MetaInfo:
      type: object
      properties:
        total_count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        request_id:
          type: string

    FileUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

    UserLoginRequest:
      type: object
      description: Must provide either username/password or refresh_token.
      properties:
        username:
          type: string
        password:
          type: string
        refresh_token:
          type: string
          nullable: true

    UserRegistrationRequest:
      type: object
      description: Final step of public signup. Requires a `verification_token` returned by `/open/verification/verify` for the same email address using `purpose=signup`.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: alice
        password:
          type: string
          minLength: 6
          maxLength: 100
          example: secret123
        email_address:
          type: string
          format: email
          example: alice@example.com
        verification_token:
          type: string
          description: One-time token returned from `/open/verification/verify`.
          example: 8f4d20f52f4bc85f9bca2414b3aa0e7fa5c7d2d7e78fd7a5fa3df0d9f5fd4c70
      required: [username, password, email_address, verification_token]

    SendVerificationCodeRequest:
      type: object
      description: Request body for sending a verification code. Use `purpose=signup` before calling public registration.
      properties:
        purpose:
          type: string
          enum: [signup, password_reset, email_change]
          example: signup
        email:
          type: string
          format: email
          example: alice@example.com
      required: [purpose, email]

    VerifyVerificationCodeRequest:
      type: object
      description: Request body for verifying a previously emailed code. The returned token is then used by the matching flow, such as public registration.
      properties:
        purpose:
          type: string
          enum: [signup, password_reset, email_change]
          example: signup
        email:
          type: string
          format: email
          example: alice@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: a1b2c3
      required: [purpose, email, code]

    VerifyVerificationCodeResponse:
      type: object
      description: One-time verification token returned after a successful code check.
      properties:
        token:
          type: string
          description: One-time token for the same purpose and email address.
          example: 8f4d20f52f4bc85f9bca2414b3aa0e7fa5c7d2d7e78fd7a5fa3df0d9f5fd4c70
        expires_at:
          type: string
          format: date-time
          example: 2026-06-01T10:30:00Z
      required: [token, expires_at]

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          nullable: true

    PasswordResetRequest:
      type: object
      properties:
        email_or_username:
          type: string
      required: [email_or_username]

    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 6
      required: [token, password]

    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          maxLength: 100
        role:
          type: string
          enum: [user, admin]
        nickname:
          type: string
        avatar_url:
          type: string
        email_address:
          type: string
        gender:
          type: string
          enum: [male, female, others, ""]
      required: [username, password]

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          maxLength: 100
        is_active:
          type: boolean
        role:
          type: string
          enum: [user, admin]
        nickname:
          type: string
        avatar_url:
          type: string
        email_address:
          type: string
        gender:
          type: string
          enum: [male, female, others, ""]

    UserProfileUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
        avatar_url:
          type: string
        gender:
          type: string
          enum: [male, female, others, ""]

    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar_url:
          type: string
        email_address:
          type: string
        is_email_verified:
          type: boolean
        gender:
          type: string
          enum: [male, female, others, ""]
        is_active:
          type: boolean
          description: Whether this account is currently active.
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
        updated_at:
          type: string

    UserConfigurationRequest:
      type: object
      properties:
        display_language:
          type: string
          minLength: 1
          maxLength: 20
          example: en
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Za-z]{3}$'
          example: HKD
        active_theme_color:
          type: string
          minLength: 1
          maxLength: 50
          example: '#2563eb'

    UserChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 6
      required: [old_password, new_password]

    UserChangeEmailRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
        verification_token:
          type: string
      required: [new_email, verification_token]

    UserConfirmEmailChangeRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
      required: [token, password]

    CashFlowRequest:
      type: object
      properties:
        belongs_date:
          type: string
          description: Transaction date. Supported formats include YYYYMMDD, YYYY-MM-DD, and YYYY/MM/DD.
          pattern: '^(\d{8}|\d{4}[-/]\d{2}[-/]\d{2})$'
        category_name:
          type: string
        amount:
          type: number
          format: double
        description:
          type: string
      required: [belongs_date, category_name, amount]

    CategoryRequest:
      type: object
      properties:
        name:
          type: string
        parent_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        type:
          type: string
          enum: [income, expense]
        remark:
          type: string
      required: [name, type]
