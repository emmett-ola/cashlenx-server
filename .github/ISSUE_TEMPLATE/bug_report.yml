name: Bug report
description: Report reproducible incorrect behavior in CashLenX Server
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, personal data, private URLs, or production logs. Report vulnerabilities privately according to SECURITY.md.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe, repeatable example.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: v0.x, branch, or commit hash
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MongoDB
        - MySQL
        - Both
        - Not applicable
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include OS, Go version, runtime mode, and sanitized configuration details.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add safe logs, request IDs, or screenshots. Remove all sensitive values.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: This report contains no credentials, personal data, or private operational details.
          required: true
        - label: This is not a vulnerability report that should be submitted privately.
          required: true
