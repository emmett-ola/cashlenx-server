name: CI Pipeline for CashLenX Server

on:
  push:
    branches: [ main, testing, develop, 'dev/**' ]
  pull_request:
    branches: [ main, testing, develop, 'dev/**' ]
  release:
    types: [ published ]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.23.0' ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install dependencies
      run: go mod download

    - name: Build
      run: go build -v ./...

    - name: Run tests with coverage
      run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: github-actions
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub (if secrets available)
      uses: docker/login-action@v4
      if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_ACCESS_TOKEN != ''
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      env:
        DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Prepare Docker tags
      id: prep-tags
      env:
        EVENT_NAME: ${{ github.event_name }}
        DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      run: |
        short_sha="${GITHUB_SHA::7}"
        if [ "$EVENT_NAME" = "release" ] \
          && [ -n "$DOCKER_HUB_USERNAME" ] \
          && [ -n "$DOCKER_HUB_ACCESS_TOKEN" ]; then
          {
            echo 'tags<<EOF'
            echo "$DOCKER_HUB_USERNAME/cashlenx-server:$short_sha"
            echo "$DOCKER_HUB_USERNAME/cashlenx-server:$GITHUB_REF_NAME"
            echo "$DOCKER_HUB_USERNAME/cashlenx-server:latest"
            echo 'EOF'
            echo 'push=true'
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "tags=cashlenx-server:$short_sha"
            echo 'push=false'
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/Dockerfile
        push: ${{ steps.prep-tags.outputs.push }}
        tags: ${{ steps.prep-tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    needs: build-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Generate HTML docs from OpenAPI spec
      run: |
        mkdir -p ./docs/html
        # Check if swagger-ui-dist is installed
        if [ ! -d "node_modules/swagger-ui-dist" ]; then
          npm install swagger-ui-dist
        fi
        # Copy swagger-ui files to docs/html
        cp -r node_modules/swagger-ui-dist/* ./docs/html
        # Create custom index.html that uses our OpenAPI spec
        cat > ./docs/html/index.html << EOF
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>CashLenX API Documentation</title>
          <link rel="stylesheet" type="text/css" href="./swagger-ui.css" />
          <style>
            body {
              margin: 0;
              padding: 0;
            }
            .swagger-ui .topbar {
              background-color: #2c3e50;
            }
          </style>
        </head>
        <body>
          <div id="swagger-ui"></div>
          <script src="./swagger-ui-bundle.js"></script>
          <script src="./swagger-ui-standalone-preset.js"></script>
          <script>
            window.onload = function() {
              const ui = SwaggerUIBundle({
                url: '../openapi.yaml',
                dom_id: '#swagger-ui',
                presets: [
                  SwaggerUIBundle.presets.apis,
                  SwaggerUIStandalonePreset
                ],
                layout: "StandaloneLayout"
              });
              window.ui = ui;
            };
          </script>
        </body>
        </html>
        EOF
        echo "HTML documentation generated successfully in ./docs/html/"

    - name: Upload docs artifact
      uses: actions/upload-artifact@v7
      with:
        name: api-docs
        path: ./docs/html
        retention-days: 7
