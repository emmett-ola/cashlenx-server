name: Server CI

on:
  push:
    branches: [main, testing, develop, 'dev/**']
  pull_request:
    branches: [main, testing, develop, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.12'
          cache: true

      - name: Download locked modules
        run: go mod download && go mod verify
        env:
          GOFLAGS: -mod=readonly

      - name: Verify exact Go toolchain
        run: test "$(go env GOVERSION)" = 'go1.23.12'

      - name: Build
        run: go build -mod=readonly -v ./...

      - name: Test with race and coverage
        run: go test -mod=readonly -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: github-actions
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  validate-image:
    name: Validate runtime image
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and verify image provenance
        run: ENV_FILE=.env.example scripts/build.sh

  package-candidate:
    name: Package untagged candidate
    if: github.event_name == 'workflow_dispatch'
    needs: [build-test, validate-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and package verified image
        run: scripts/package-image.sh "$RUNNER_TEMP/candidate"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cashlenx-server-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
