name: cashlenx-mongodb

services:
  mongodb:
    image: ${MONGO_IMAGE:-mongo:7.0}
    container_name: ${MONGO_CONTAINER_NAME:-cashlenx-mongodb}
    restart: unless-stopped
    cpus: ${MONGO_CPU_LIMIT:-1.0}
    mem_limit: ${MONGO_MEMORY_LIMIT:-1g}
    mem_reservation: ${MONGO_MEMORY_RESERVATION:-256m}
    pids_limit: ${MONGO_PIDS_LIMIT:-256}
    stop_grace_period: ${MONGO_STOP_GRACE_PERIOD:-30s}
    environment:
      TZ: ${TIMEZONE:-UTC}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${DB_NAME:-cashlenx}
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - type: volume
        source: mongodb_data
        target: /data/db
      - type: bind
        source: ./init-mongo.js
        target: /docker-entrypoint-initdb.d/init-mongo.js
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' 127.0.0.1:27017/$${MONGO_INITDB_DATABASE} >/dev/null"]
      interval: ${MONGO_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${MONGO_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${MONGO_HEALTHCHECK_RETRIES:-20}
      start_period: ${MONGO_HEALTHCHECK_START_PERIOD:-20s}

volumes:
  mongodb_data:
    name: cashlenx-mongodb-data
